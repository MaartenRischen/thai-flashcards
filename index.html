<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e0c" />
    <meta name="description" content="100 high-frequency Thai phrases with sound-alike mnemonics, tone contours and spaced repetition. Works offline." />
    <title>Thai Mnemonic Flashcards</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem('tfc.theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <!--
      Static first paint. The CSS is render-blocking but tiny, so this shell
      paints as soon as the HTML lands — roughly a second before the React
      bundle finishes parsing on a throttled connection. Its geometry is
      identical to the real shell in App.tsx, so React replacing it costs no
      layout shift.
    -->
    <div id="root">
      <div
        class="mx-auto flex h-full w-full max-w-2xl flex-col px-4 pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom))]"
      >
        <main class="flex min-h-0 flex-1 items-center justify-center text-sm opacity-70">
          Loading…
        </main>
        <nav
          class="mt-3 flex shrink-0 gap-1 rounded-2xl border border-ink/10 p-1 dark:border-paper/10"
        >
          <span class="flex-1 rounded-xl bg-amber/25 py-2 text-center text-sm font-medium">Review</span>
          <span class="flex-1 rounded-xl py-2 text-center text-sm font-medium opacity-70">Browse</span>
          <span class="flex-1 rounded-xl py-2 text-center text-sm font-medium opacity-70">Settings</span>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
